<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14664A">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Meniu — Prusakovų užeiga</title>
<meta name="description" content="Prusakovų užeigos meniu: čeburekai, koldūnai, bulviniai patiekalai, užkandžiai, desertai ir gėrimai.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --paper: #FBF7F0; --ink: #1D2A23; --green: #14664A; --green-dark: #0E4A36; --amber: #B5761B;
}
html, body { height: 100%; }
body { display: flex; flex-direction: column; font-family: 'Manrope', system-ui, sans-serif; color: var(--ink); background: var(--paper); overflow: hidden; }
.hdr { flex: none; background: var(--green); color: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.12); }
.hdr-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 1200px; margin: 0 auto; padding: 12px 16px; }
.brand { color: #fff; text-decoration: none; font-weight: 800; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; }
.brand small { display: block; margin-top: 2px; font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 500; font-size: 15px; letter-spacing: 0; text-transform: none; opacity: .85; }
.tools { display: flex; align-items: center; gap: 10px; }
.langs { display: flex; gap: 4px; padding: 3px; border-radius: 99px; background: rgba(255,255,255,.12); }
.langs button { min-width: 38px; padding: 7px 10px; border: 0; border-radius: 99px; background: none; color: #fff; font: 700 13px 'Manrope', sans-serif; cursor: pointer; }
.langs button.on { background: #fff; color: var(--green-dark); }
.pdf { display: inline-flex; align-items: center; gap: 7px; padding: 9px 15px 9px 12px; border-radius: 99px; background: rgba(255,255,255,.14); color: #fff; font: 800 13.5px 'Manrope', sans-serif; text-decoration: none; white-space: nowrap; }
.pdf svg { flex: none; width: 16px; height: 16px; }
.brand-sub span, .pdf span { display: none; }
html[lang="lt"] :is(.brand-sub, .pdf) [lang="lt"], html[lang="ru"] :is(.brand-sub, .pdf) [lang="ru"], html[lang="en"] :is(.brand-sub, .pdf) [lang="en"], html[lang="pl"] :is(.brand-sub, .pdf) [lang="pl"] { display: inline; }
.track-wrap { flex: none; width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 16px; }
.track { position: relative; display: flex; align-items: center; gap: 14px; margin: 14px 0 0; padding: 14px 14px 14px 16px; border-radius: 18px; background: linear-gradient(110deg, #B5761B 0%, #D3953A 55%, #C7842A 100%); color: #fff; text-decoration: none; box-shadow: 0 8px 22px rgba(181,118,27,.32); overflow: hidden; }
.track::before { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.22) 50%, transparent 70%); transform: translateX(-100%); animation: track-shine 4.5s ease-in-out infinite; }
.track-ic { position: relative; flex: none; width: 44px; height: 44px; border-radius: 14px; background: rgba(255,255,255,.2); display: flex; align-items: center; justify-content: center; }
.track-ic svg { width: 24px; height: 24px; }
.track-ic i { position: absolute; top: -3px; right: -3px; width: 12px; height: 12px; border-radius: 50%; background: #3DDC84; border: 2px solid #C98A30; }
.track-ic i::after { content: ""; position: absolute; inset: -2px; border-radius: 50%; background: #3DDC84; animation: track-pulse 1.8s ease-out infinite; }
.track-tx { position: relative; flex: 1; min-width: 0; }
.track-tx strong { display: block; font-size: 17px; font-weight: 800; line-height: 1.25; }
.track-tx small { display: block; font-size: 13.5px; font-weight: 600; opacity: .9; margin-top: 2px; }
.track-go { position: relative; flex: none; width: 38px; height: 38px; border-radius: 50%; background: #fff; color: var(--amber); display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
.track-go svg { width: 20px; height: 20px; }
.track:active { transform: scale(.985); }
.track-tx span { display: none; }
html[lang="lt"] .track-tx [lang="lt"], html[lang="ru"] .track-tx [lang="ru"], html[lang="en"] .track-tx [lang="en"], html[lang="pl"] .track-tx [lang="pl"] { display: inline; }
@keyframes track-pulse { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(2.6); opacity: 0; } }
@keyframes track-shine { 0%, 55% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
@media (prefers-reduced-motion: reduce) { .track::before, .track-ic i::after { animation: none; } }
@media (max-width: 480px) { .track { gap: 12px; padding: 12px 12px 12px 14px; border-radius: 16px; } .track-ic { width: 40px; height: 40px; } .track-tx strong { font-size: 16px; } .track-tx small { font-size: 12.5px; } }
#flipbook { flex: 1; min-height: 0; display: block; width: 100%; max-width: 1320px; margin: 6px auto 0; border: 0; }
@media (max-width: 560px) {
  .hdr-top { padding: 10px 12px; }
  .pdf { padding: 9px; }
  .pdf span { display: none !important; }
}
</style>
</head>
<body>
<header class="hdr">
  <div class="hdr-top">
    <div class="brand">Prusakovų užeiga<small class="brand-sub"><span lang="lt">Meniu</span><span lang="ru">Меню</span><span lang="en">Menu</span><span lang="pl">Menu</span></small></div>
    <div class="tools">
      <div class="langs"><button type="button" data-lang="lt">LT</button><button type="button" data-lang="ru">RU</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="pl">PL</button></div>
      <a class="pdf" href="/menus/menu-prusakovu.pdf" download aria-label="PDF"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg><span lang="lt">Meniu PDF</span><span lang="ru">Меню в PDF</span><span lang="en">Menu PDF</span><span lang="pl">Menu PDF</span></a>
    </div>
  </div>
</header>
<div class="track-wrap"><a class="track" href="https://status.prusakovuuzeiga.lt"><span class="track-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2.5h5"/></svg><i></i></span><span class="track-tx"><strong><span lang="lt">Sekite savo užsakymą</span><span lang="ru">Следите за своим заказом</span><span lang="en">Track your order</span><span lang="pl">Śledź swoje zamówienie</span></strong><small><span lang="lt">Užsakymų būsena realiu laiku</span><span lang="ru">Статус заказов в реальном времени</span><span lang="en">Live order status</span><span lang="pl">Status zamówień na żywo</span></small></span><span class="track-go" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m0 0l-6-6m6 6l-6 6"/></svg></span></a></div>
<iframe id="flipbook" title="Meniu" allowfullscreen></iframe>
<script>
(function () {
  var langs = ['lt', 'ru', 'en', 'pl'];
  var desktop = matchMedia('(min-width: 1024px) and (hover: hover) and (pointer: fine)').matches;
  var book = desktop
    ? { src: '/menu.html?embed&pdf=a4', pdf: '/menus/menu-prusakovu-a4.pdf', start: { lt: 2, ru: 11, en: 20, pl: 29 } }
    : { src: '/menu.html?embed', pdf: '/menus/menu-prusakovu.pdf', start: { lt: 2, ru: 18, en: 34, pl: 50 } };
  var frame = document.getElementById('flipbook');
  function stored() { try { return localStorage.getItem('menu-lang'); } catch (e) { return null; } }
  function remember(l) { try { localStorage.setItem('menu-lang', l); } catch (e) {} }
  function pick() {
    var q = new URLSearchParams(location.search).get('lang');
    if (langs.indexOf(q) > -1) return q;
    var s = stored(); if (langs.indexOf(s) > -1) return s;
    var b = (navigator.language || 'lt').slice(0, 2);
    return langs.indexOf(b) > -1 ? b : 'lt';
  }
  function setLang(l, openPage) {
    document.documentElement.lang = l;
    document.querySelectorAll('.langs button').forEach(function (b) { b.classList.toggle('on', b.dataset.lang === l); });
    remember(l);
    frame.setAttribute('src', book.src + '#p' + (openPage ? book.start[l] : 1));
  }
  document.querySelectorAll('.langs button').forEach(function (b) {
    b.addEventListener('click', function () { setLang(b.dataset.lang, true); });
  });
  document.querySelector('.pdf').setAttribute('href', book.pdf);
  setLang(pick(), false);
})();
</script>
</body>
</html>
