<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meniu — Prusakovų užeiga</title>
<meta name="theme-color" content="#14664A">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root {
  --paper: #FBF7F0;
  --ink: #1D2A23;
  --muted: #6E756F;
  --green: #14664A;
  --green-soft: #E3EFE8;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #E9E4DA; color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.bar { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 12px; background: var(--green); }
.bar a { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; color: #fff; font-weight: 600; font-size: 15px; text-decoration: none; background: rgba(255, 255, 255, .14); }
.bar svg { width: 18px; height: 18px; }
#page { position: relative; max-width: 560px; margin: 0 auto; background: var(--paper); }
#page canvas { display: block; width: 100%; height: auto; }
#page a { position: absolute; display: block; -webkit-tap-highlight-color: rgba(20, 102, 74, .18); }
#status { padding: 48px 16px; text-align: center; color: var(--muted); font-size: 15px; }
#status a { color: var(--green); font-weight: 600; }
.spin { width: 28px; height: 28px; margin: 0 auto 12px; border: 3px solid var(--green-soft); border-top-color: var(--green); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="bar">
  <a href="./"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m0 0l6-6m-6 6l6 6"/></svg>prusakovuuzeiga.lt</a>
  <a href="menus/menu-prusakovu.pdf" download aria-label="PDF"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg>PDF</a>
</div>
<div id="status"><div class="spin"></div>Meniu kraunamas…</div>
<div id="page" hidden></div>
<script type="module">
import * as pdfjsLib from './menus/pdfjs/pdf.min.js';

pdfjsLib.GlobalWorkerOptions.workerSrc = './menus/pdfjs/pdf.worker.min.js';

const FIRST_PAGE = 2;
const holder = document.getElementById('page');
const status = document.getElementById('status');
let pdf, rendering = 0;

function pageFromHash() {
  const n = parseInt(location.hash.replace('#p', ''), 10);
  return n >= 1 && n <= pdf.numPages ? n : FIRST_PAGE;
}

async function targetPage(dest) {
  const explicit = typeof dest === 'string' ? await pdf.getDestination(dest) : dest;
  if (!explicit) {
    return null;
  }
  const ref = explicit[0];
  return (typeof ref === 'object' ? await pdf.getPageIndex(ref) : ref) + 1;
}

async function show(number) {
  const ticket = ++rendering;
  const page = await pdf.getPage(number);
  const base = page.getViewport({ scale: 1 });
  const width = holder.clientWidth || Math.min(innerWidth, 560);
  const ratio = Math.min(window.devicePixelRatio || 1, 3);
  const viewport = page.getViewport({ scale: width / base.width * ratio });
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(viewport.width);
  canvas.height = Math.round(viewport.height);
  await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
  if (ticket !== rendering) {
    return;
  }

  const links = [];
  for (const note of await page.getAnnotations()) {
    if (note.subtype !== 'Link' || !note.dest) {
      continue;
    }
    const target = await targetPage(note.dest);
    if (!target) {
      continue;
    }
    const [x0, y0, x1, y1] = pdfjsLib.Util.normalizeRect(note.rect);
    const a = document.createElement('a');
    a.href = '#p' + target;
    a.style.left = (x0 / base.width * 100) + '%';
    a.style.top = ((base.height - y1) / base.height * 100) + '%';
    a.style.width = ((x1 - x0) / base.width * 100) + '%';
    a.style.height = ((y1 - y0) / base.height * 100) + '%';
    links.push(a);
  }

  holder.replaceChildren(canvas, ...links);
  holder.hidden = false;
  status.hidden = true;
  scrollTo(0, 0);
}

try {
  pdf = await pdfjsLib.getDocument({ url: 'menus/menu-prusakovu.pdf', isEvalSupported: false }).promise;
  addEventListener('hashchange', () => show(pageFromHash()));
  await show(pageFromHash());
} catch (error) {
  status.innerHTML = 'Nepavyko atidaryti meniu. <a href="menus/menu-prusakovu.pdf">Atsisiųsti PDF</a>';
}
</script>
</body>
</html>
