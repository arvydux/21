<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meniu — Prusakovų užeiga</title>
<meta name="theme-color" content="#14664A">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico?v=3" sizes="48x48">
<link rel="icon" href="/icon-192.png?v=3" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
<style>
:root {
  --paper: #FBF7F0;
  --ink: #1D2A23;
  --muted: #6E756F;
  --green: #14664A;
  --green-soft: #E3EFE8;
  --bar-h: 52px;
  --nav-h: 60px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #E9E4DA; color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; height: var(--bar-h); padding: 0 12px; background: var(--green); }
.bar a { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; color: #fff; font-weight: 600; font-size: 15px; text-decoration: none; background: rgba(255, 255, 255, .14); }
.bar svg { width: 18px; height: 18px; }
.embed { --bar-h: 0px; }
.embed, .embed body { background: transparent; overscroll-behavior: auto; }
.embed .bar { display: none; }
.embed #book { filter: drop-shadow(0 10px 16px rgba(40, 30, 15, .18)) drop-shadow(0 1px 2px rgba(40, 30, 15, .12)); }
.stage { position: relative; height: calc(100dvh - var(--bar-h) - var(--nav-h)); padding: 10px 8px 0; }
.stage { overflow: hidden; }
#book .stf__wrapper { height: 100%; padding-bottom: 0 !important; }
.embed .stage { padding: 6px 104px 20px; }
.side { position: absolute; top: 50%; z-index: 3; display: grid; place-items: center; width: 68px; height: 68px; padding: 0; border: 0; border-radius: 50%; background: var(--green); color: #fff; box-shadow: 0 8px 20px rgba(20, 102, 74, .32), 0 2px 4px rgba(0, 0, 0, .12); cursor: pointer; translate: 0 -50%; transition: background .2s, scale .2s, box-shadow .2s, opacity .2s; }
.side:hover { background: var(--green-dark, #0E4A36); scale: 1.08; box-shadow: 0 12px 26px rgba(20, 102, 74, .4), 0 2px 4px rgba(0, 0, 0, .12); }
.side:active { scale: .96; }
.side:focus-visible { outline: 3px solid var(--green-soft); outline-offset: 3px; }
.side:disabled { opacity: 0; pointer-events: none; }
.side svg { width: 34px; height: 34px; }
#prev svg { margin-right: 3px; }
#next svg { margin-left: 3px; }
#prev { left: 16px; }
#next { right: 16px; }
.side.hint::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--green); animation: hint 1.8s ease-out infinite; z-index: -1; }
.side.hint svg { animation: nudge 1.8s ease-in-out infinite; }
@keyframes hint { 0% { transform: scale(1); opacity: .5; } 100% { transform: scale(1.7); opacity: 0; } }
@keyframes nudge { 0%, 100% { translate: 0; } 50% { translate: 4px; } }
@media (prefers-reduced-motion: reduce) { .side.hint::before, .side.hint svg { animation: none; } }
@media (max-width: 700px) {
  .embed .stage { padding: 8px 8px 4px; }
  .side { width: 48px; height: 48px; }
  .side svg { width: 26px; height: 26px; }
  #prev { left: 6px; }
  #next { right: 6px; }
}

#book { height: 100%; transition: transform .6s ease; }
#book.closed { transform: translateX(var(--cover-shift)); }
.page { background: var(--paper); overflow: hidden; }
.page canvas { display: block; width: 100%; height: 100%; }
.--landscape .page.ready { background: transparent; }
.page a { position: absolute; display: block; z-index: 1; -webkit-tap-highlight-color: rgba(20, 102, 74, .18); }
.page:not(.ready)::after { content: ""; position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; border: 3px solid var(--green-soft); border-top-color: var(--green); border-radius: 50%; animation: spin .8s linear infinite; }
.nav { display: flex; justify-content: center; align-items: center; gap: 14px; height: var(--nav-h); padding-bottom: env(safe-area-inset-bottom); }
.nav button { display: grid; place-items: center; width: 42px; height: 42px; padding: 0; border: 0; border-radius: 50%; background: #fff; color: var(--green); box-shadow: 0 2px 8px rgba(0, 0, 0, .12); cursor: pointer; }
.nav button:disabled { opacity: .35; cursor: default; }
.nav button svg { width: 20px; height: 20px; }
#fullscreen { margin-left: 6px; }
#fullscreen[hidden] { display: none; }
#fullscreen .exit, :fullscreen #fullscreen .enter { display: none; }
:fullscreen #fullscreen .exit { display: block; }
.embed:fullscreen, .embed:fullscreen body { background: var(--paper); }
#counter { min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 15px; font-weight: 600; }
#status { position: absolute; inset: 0; display: grid; place-content: center; padding: 16px; text-align: center; color: var(--muted); font-size: 15px; }
#status[hidden] { display: none; }
#status a { color: var(--green); font-weight: 600; }
.spin { width: 28px; height: 28px; margin: 0 auto 12px; border: 3px solid var(--green-soft); border-top-color: var(--green); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<script>if (new URLSearchParams(location.search).has('embed')) document.documentElement.classList.add('embed');</script>
<div class="bar">
  <a href="./"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m0 0l6-6m-6 6l6 6"/></svg>prusakovuuzeiga.lt</a>
  <a href="menus/menu-prusakovu.pdf" download aria-label="PDF"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg>PDF</a>
</div>
<div class="stage">
  <div id="status"><div><div class="spin"></div>Meniu kraunamas…</div></div>
  <div id="book"></div>
  <button id="prev" class="side" type="button" aria-label="Atgal" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button id="next" class="side" type="button" aria-label="Pirmyn" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
</div>
<div class="nav">
  <span id="counter"></span>
  <button id="fullscreen" type="button" aria-label="Visas ekranas" hidden><svg class="enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><svg class="exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg></button>
</div>
<script src="menus/pageflip/page-flip.browser.js"></script>
<script type="module">
import * as pdfjsLib from './menus/pdfjs/pdf.min.js';

pdfjsLib.GlobalWorkerOptions.workerSrc = './menus/pdfjs/pdf.worker.min.js';

const FIRST_PAGE = 2;
const A4 = new URLSearchParams(location.search).get('pdf') === 'a4';
const SOURCE = A4 ? 'menus/menu-prusakovu-a4-web.pdf' : 'menus/menu-prusakovu.pdf';
const LANGUAGE_STARTS = A4 ? [2, 11, 20, 29] : [];
const KEEP_RENDERED = 6;
const CURL_ANGLE = 1.25;
const CURL_WIDTH = 0.07;
const CURL_DIP = 0.007;
const book = document.getElementById('book');
const status = document.getElementById('status');
const counter = document.getElementById('counter');
const prev = document.getElementById('prev');
const next = document.getElementById('next');
const pages = [];
const sheets = [];
const rendered = new Map();
let pdf, flipbook, pageSize, queue = Promise.resolve();

/**
 * Flipbook sheets as PDF page numbers, with a blank sheet (0) before every language
 * that would otherwise start on a right-hand page, so each language opens as a spread.
 */
function buildSheets() {
  for (let n = 1; n <= pdf.numPages; n++) {
    if (LANGUAGE_STARTS.includes(n) && sheets.length % 2 === 0) {
      sheets.push(0);
    }
    sheets.push(n);
  }
}

function sheetOf(pageNumber) {
  return Math.max(sheets.indexOf(pageNumber), 0);
}

function pageFromHash() {
  const n = parseInt(location.hash.replace('#p', ''), 10);
  return n >= 1 && n <= pdf.numPages ? n : FIRST_PAGE;
}

async function targetPage(dest) {
  const explicit = typeof dest === 'string' ? await pdf.getDestination(dest) : dest;
  if (!explicit) {
    return null;
  }
  const ref = explicit[0];
  return (typeof ref === 'object' ? await pdf.getPageIndex(ref) : ref) + 1;
}

function spreadSide(index) {
  if (flipbook.getOrientation() !== 'landscape' || index === 0) {
    return null;
  }
  return index % 2 === 1 ? 'left' : 'right';
}

/**
 * Redraws the strip of the page next to the spine as paper bending into the binding:
 * columns follow a cylinder (compressed towards the spine), get shaded by the surface
 * angle, and the top and bottom edges dip slightly.
 */
function curl(source, side) {
  const width = source.width;
  const height = source.height;
  const radius = width * CURL_WIDTH / Math.sin(CURL_ANGLE);
  const flat = Math.round(width - radius * Math.sin(CURL_ANGLE));
  const scale = width / (flat + radius * CURL_ANGLE);
  const out = document.createElement('canvas');
  out.width = width;
  out.height = height;
  const ctx = out.getContext('2d');
  const mirror = (x, w) => side === 'left' ? x : width - x - w;

  ctx.drawImage(source, mirror(0, flat * scale), 0, flat * scale, height, mirror(0, flat), 0, flat, height);

  for (let d = 0; d < width - flat; d++) {
    const from = Math.asin(Math.min(d / radius, Math.sin(CURL_ANGLE)));
    const to = Math.asin(Math.min((d + 1) / radius, Math.sin(CURL_ANGLE)));
    const theta = (from + to) / 2;
    const sourceX = (flat + radius * from) * scale;
    const sourceWidth = Math.max((to - from) * radius * scale, 1);
    const dip = height * CURL_DIP * (1 - Math.cos(theta)) / (1 - Math.cos(CURL_ANGLE));
    const x = mirror(flat + d, 1);

    ctx.drawImage(source, mirror(sourceX, sourceWidth), 0, sourceWidth, height, x, dip, 1, height - 2 * dip);

    const bend = 1 - Math.cos(theta);
    const shade = side === 'left' ? 0.34 * bend ** 1.4 : 0.26 * bend ** 2.2;
    const shine = (side === 'left' ? 0.1 : 0.32) * Math.exp(-(((theta - 0.55) / 0.22) ** 2));
    ctx.fillStyle = `rgba(55, 40, 20, ${shade})`;
    ctx.fillRect(x, dip, 1, height - 2 * dip);
    ctx.fillStyle = `rgba(255, 255, 255, ${shine})`;
    ctx.fillRect(x, dip, 1, height - 2 * dip);
  }

  return out;
}

function renderBlank(index) {
  const width = flipbook.getBoundsRect().pageWidth || 400;
  const ratio = Math.min(window.devicePixelRatio || 1, 2.5);
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(width * ratio);
  canvas.height = Math.round(width * pageSize.height / pageSize.width * ratio);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--paper');
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const side = spreadSide(index);
  pages[index].replaceChildren(side ? curl(canvas, side) : canvas);
  pages[index].classList.add('ready');
}

async function render(index) {
  if (sheets[index] === 0) {
    renderBlank(index);
    return;
  }
  const holder = pages[index];
  const page = await pdf.getPage(sheets[index]);
  const base = page.getViewport({ scale: 1 });
  const width = flipbook.getBoundsRect().pageWidth || 400;
  const ratio = Math.min(window.devicePixelRatio || 1, 2.5);
  const viewport = page.getViewport({ scale: width / base.width * ratio });
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(viewport.width);
  canvas.height = Math.round(viewport.height);
  await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
  const side = spreadSide(index);

  const links = [];
  for (const note of await page.getAnnotations()) {
    if (note.subtype !== 'Link' || !note.dest) {
      continue;
    }
    const target = await targetPage(note.dest);
    if (!target) {
      continue;
    }
    const [x0, y0, x1, y1] = pdfjsLib.Util.normalizeRect(note.rect);
    const a = document.createElement('a');
    a.href = '#p' + target;
    a.dataset.page = target;
    a.style.left = (x0 / base.width * 100) + '%';
    a.style.top = ((base.height - y1) / base.height * 100) + '%';
    a.style.width = ((x1 - x0) / base.width * 100) + '%';
    a.style.height = ((y1 - y0) / base.height * 100) + '%';
    links.push(a);
  }

  holder.replaceChildren(side ? curl(canvas, side) : canvas, ...links);
  holder.classList.add('ready');
}

function renderAround(index) {
  const wanted = [index, index + 1, index - 1, index + 2, index + 3, index - 2];
  for (const [key, holder] of rendered) {
    if (Math.abs(key - index) > KEEP_RENDERED) {
      holder.replaceChildren();
      holder.classList.remove('ready');
      rendered.delete(key);
    }
  }
  for (const i of wanted) {
    if (i < 0 || i >= pages.length || rendered.has(i)) {
      continue;
    }
    rendered.set(i, pages[i]);
    queue = queue.then(() => render(i)).catch(() => rendered.delete(i));
  }
}

function update(index) {
  const lastSheet = flipbook.getOrientation() === 'landscape' && index > 0 ? Math.min(index + 1, sheets.length - 1) : index;
  const shown = sheets.slice(index, lastSheet + 1).filter(Boolean);
  const first = shown[0] || sheets[index + 1] || sheets[index - 1];
  const last = shown[shown.length - 1] || first;
  counter.textContent = (last > first ? first + '–' + last : last) + ' / ' + pdf.numPages;
  prev.disabled = index === 0;
  next.disabled = lastSheet >= sheets.length - 1;
  next.classList.toggle('hint', index === 0);
  history.replaceState(null, '', '#p' + first);
  renderAround(index);
  centerCover(index);
}

function centerCover(index) {
  const closed = flipbook.getOrientation() === 'landscape' && index === 0;
  book.style.setProperty('--cover-shift', -flipbook.getBoundsRect().pageWidth / 2 + 'px');
  book.classList.toggle('closed', closed);
}

try {
  pdf = await pdfjsLib.getDocument({ url: SOURCE, isEvalSupported: false }).promise;
  const first = await pdf.getPage(1);
  const size = first.getViewport({ scale: 1 });
  pageSize = size;
  buildSheets();

  for (let i = 0; i < sheets.length; i++) {
    const holder = document.createElement('div');
    holder.className = 'page';
    pages.push(holder);
  }

  flipbook = new St.PageFlip(book, {
    width: size.width,
    height: size.height,
    size: 'stretch',
    minWidth: 280,
    maxWidth: 1000,
    minHeight: 300,
    maxHeight: 2000,
    showCover: true,
    usePortrait: true,
    mobileScrollSupport: false,
    maxShadowOpacity: 0.4,
    flippingTime: 700,
    startPage: sheetOf(pageFromHash()),
  });
  flipbook.loadFromHTML(pages);
  flipbook.on('flip', (event) => update(event.data));
  flipbook.on('changeState', (event) => {
    if (event.data === 'user_fold' || event.data === 'flipping') {
      book.classList.remove('closed');
    } else if (event.data === 'read') {
      centerCover(flipbook.getCurrentPageIndex());
    }
  });
  flipbook.on('changeOrientation', () => {
    for (const [key, holder] of rendered) {
      holder.replaceChildren();
      holder.classList.remove('ready');
      rendered.delete(key);
    }
    update(flipbook.getCurrentPageIndex());
  });

  addEventListener('hashchange', () => {
    const target = sheetOf(pageFromHash());
    if (Math.abs(target - flipbook.getCurrentPageIndex()) > 1) {
      flipbook.turnToPage(target);
      update(target);
    }
  });
  book.addEventListener('click', (event) => {
    const link = event.target.closest('a[data-page]');
    if (link) {
      event.preventDefault();
      flipbook.flip(sheetOf(Number(link.dataset.page)));
    }
  });
  const fullscreen = document.getElementById('fullscreen');
  fullscreen.hidden = !document.fullscreenEnabled;
  fullscreen.addEventListener('click', () => {
    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else {
      document.documentElement.requestFullscreen();
    }
  });
  let renderedWidth = flipbook.getBoundsRect().pageWidth;
  let resizeTimer;
  addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const width = flipbook.getBoundsRect().pageWidth;
      if (Math.abs(width - renderedWidth) > 40) {
        renderedWidth = width;
        const current = flipbook.getCurrentPageIndex();
        for (const [key, holder] of rendered) {
          if (Math.abs(key - current) > 3) {
            holder.replaceChildren();
            holder.classList.remove('ready');
          }
          rendered.delete(key);
        }
      }
      update(flipbook.getCurrentPageIndex());
    }, 250);
  });
  prev.addEventListener('click', () => flipbook.flipPrev());
  next.addEventListener('click', () => flipbook.flipNext());
  addEventListener('keydown', (event) => {
    if (event.key === 'ArrowLeft') {
      flipbook.flipPrev();
    } else if (event.key === 'ArrowRight') {
      flipbook.flipNext();
    }
  });

  status.hidden = true;
  update(flipbook.getCurrentPageIndex());
} catch (error) {
  status.innerHTML = '<div>Nepavyko atidaryti meniu. <a href="' + SOURCE + '">Atsisiųsti PDF</a></div>';
}
</script>
</body>
</html>
